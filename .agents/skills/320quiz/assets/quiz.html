<div id="quiz320-preview">
  <h2>CSE 320 · Practice quiz</h2>
  <p class="text-muted">2 questions · 5 choices each · Immediate marking · Explanations on demand</p>
  <div class="nav nav-pills" role="tablist" aria-label="Quiz preview">
    <button class="nav-link active" id="quiz320-test-tab" type="button" role="tab" aria-controls="quiz320-test" aria-selected="true">Quiz</button>
    <button class="nav-link" id="quiz320-results-tab" type="button" role="tab" aria-controls="quiz320-results" aria-selected="false" disabled>Results</button>
  </div>
  <div id="quiz320-test" role="tabpanel" aria-labelledby="quiz320-test-tab">
    <div class="viz-row quiz320-space"><span id="quiz320-count" class="tabular-nums"></span><span id="quiz320-topic" class="viz-badge"></span></div>
    <div id="quiz320-progress" class="progress" role="progressbar" aria-label="Questions answered" aria-valuemin="0" aria-valuemax="2" aria-valuenow="0"><div class="progress-bar" style="width:0%"></div></div>
    <div id="quiz320-question"></div>
    <div id="quiz320-feedback" aria-live="polite" aria-atomic="true"></div>
    <div class="viz-row quiz320-space">
      <button id="quiz320-prev" class="btn" type="button">Previous</button>
      <button id="quiz320-next" class="btn btn-primary" type="button">Next</button>
      <button id="quiz320-skip-reasks" class="btn" type="button" hidden>Skip re-asks and finish</button>
    </div>
  </div>
  <div id="quiz320-results" role="tabpanel" aria-labelledby="quiz320-results-tab" hidden>
    <h3 id="quiz320-score"></h3>
    <div id="quiz320-overview" aria-live="polite"></div>
    <div class="viz-row quiz320-space"><button id="quiz320-explain-results" class="btn" type="button">Explain my results</button><button id="quiz320-practice-missed" class="btn" type="button">Practice what I missed</button></div>
    <div id="quiz320-explanation-status" class="text-small" aria-live="polite"></div>
    <div id="quiz320-teach" class="quiz320-space"></div>
    <div id="quiz320-review"></div>
    <div class="viz-row quiz320-space"><button id="quiz320-retry-missed" class="btn" type="button">Retry missed</button><button id="quiz320-retry" class="btn btn-primary" type="button">Try again</button></div>
  </div>
</div>
<style>
/* Keep vertical margins inside the root measured by the chat. */
#quiz320-preview{display:flow-root}
#quiz320-skip-reasks[hidden]{display:none}
#quiz320-preview .quiz320-space{margin:16px 0}
#quiz320-preview .quiz320-options{display:flex;flex-direction:column;gap:16px;margin:20px 0;padding:0;border:0;min-width:0}
#quiz320-preview .quiz320-code{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--foreground)}
#quiz320-preview .quiz320-tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,295px),1fr));align-items:start;gap:12px 20px;margin:12px 0}
#quiz320-preview .quiz320-tables table{margin:0}
#quiz320-preview .quiz320-tables caption{text-align:left;font-weight:500}
#quiz320-preview .quiz320-tables th,#quiz320-preview .quiz320-tables td{overflow-wrap:anywhere}
#quiz320-preview .quiz320-status{font-weight:500;color:var(--foreground)}
#quiz320-preview .quiz320-review-item{padding:16px 0;border-bottom:1px solid var(--border)}
#quiz320-preview .quiz320-teach-field{width:100%;max-width:100%;box-sizing:border-box;margin:8px 0}
</style>
<script type="application/json" id="quiz320-preview-bank">
[
  {
    "id": "cache-bits",
    "topic": "Cache · Address bits",
    "q": "A byte-addressed system uses 32-bit addresses. Its 2-way cache has 2,048 bytes of data capacity and 32-byte blocks. Which set count and tag/index/offset bit counts are correct?",
    "options": [
      "64 sets; tag 21, index 6, offset 5.",
      "32 sets; tag 22, index 5, offset 5.",
      "32 sets; tag 21, index 5, offset 5, plus 1 way-selection bit.",
      "32 sets; tag 22, index 5, offset 32.",
      "16 sets; tag 23, index 4, offset 5."
    ],
    "answer": 1,
    "correctSkill": "Calculating sets and splitting address bits",
    "source": "Template example · cache geometry"
  },
  {
    "id": "side-effects",
    "topic": "Basic code · Compiler optimizations",
    "q": "Run each version separately, starting calls at 0. What are (sum, calls) after the original and the proposed replacement?",
    "code": "int calls = 0;\nint next_value(void) { return ++calls; }\n\n/* Original */\nint sum = 0;\nfor (int i = 0; i < 4; i++)\n    sum += next_value();\n\n/* Proposed replacement */\nint sum = 0;\nint v = next_value();\nfor (int i = 0; i < 4; i++)\n    sum += v;",
    "options": [
      "Original (4, 4); replacement (4, 1).",
      "Original (10, 4); replacement (10, 1).",
      "Original (10, 4); replacement (4, 1).",
      "Original (6, 3); replacement (3, 1).",
      "Both (10, 4), because the function has no parameters."
    ],
    "answer": 2,
    "correctSkill": "Tracing function side effects before moving a call",
    "source": "Template example · function side effects"
  }
]
</script>
<script>
(() => {
  const root=document.getElementById('quiz320-preview');
  const questions=JSON.parse(document.getElementById('quiz320-preview-bank').textContent);
  const bankSize=questions.length;
  let signature=2166136261;
  for(const char of JSON.stringify(questions))signature=Math.imul(signature^char.charCodeAt(0),16777619);
  const quizKey=(signature>>>0).toString(36);
  const standalone=document.documentElement.hasAttribute('data-quiz-standalone');
  const storageKey='320quiz:'+root.id+':'+quizKey;
  root.querySelector('h2 + p').textContent=bankSize+' questions · 5 choices each · Optional re-asks at the end · Explanations on demand';
  const el=name=>root.querySelector('#quiz320-'+name);
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  // Seeded PRNG (mulberry32) so question order and option order are reproducible from state.
  const rng=seed=>()=>{seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^seed>>>15,1|seed);t=(t+Math.imul(t^t>>>7,61|t))^t;return((t^t>>>14)>>>0)/4294967296;};
  const shuffle=(list,random)=>{const out=list.slice();for(let i=out.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;};
  const newSeed=()=>(Math.random()*4294967296)>>>0;
  // Each attempt presents a pool of bank indices in a shuffled order; answers hold the ORIGINAL option index.
  const fresh=(pool=questions.map((q,i)=>i),seed=newSeed())=>({format:'320quiz',quizKey,seed,items:shuffle(pool,rng(seed)),answers:Array(pool.length).fill(null),index:0,tab:'quiz',teach:''});
  let state=fresh();
  const valid=s=>s?.format==='320quiz' && s.quizKey===quizKey && Number.isInteger(s.seed) && Array.isArray(s.items) && s.items.length>0 && s.items.every(i=>Number.isInteger(i)&&i>=0&&i<bankSize) && Number.isInteger(s.index) && s.index>=0 && s.index<s.items.length && Array.isArray(s.answers) && s.answers.length===s.items.length && s.answers.every(a=>a===null || Number.isInteger(a)&&a>=0&&a<5) && ['quiz','results'].includes(s.tab) && (s.teach===undefined||typeof s.teach==='string'&&s.teach.length<=TEACH_MAX)
    && (s.skippedReasks===undefined||Number.isInteger(s.skippedReasks)&&s.skippedReasks>=0&&s.skippedReasks<=bankSize*(MAX_ASKS-1));
  const total=()=>state.items.length;
  const qAt=k=>questions[state.items[k]];
  const MAX_ASKS=3,TEACH_MAX=600;
  // occurrence(k): how many times the same bank question appears before item k (0 = first attempt).
  const occurrence=k=>state.items.slice(0,k).filter(i=>i===state.items[k]).length;
  const firstItems=()=>state.items.map((_,k)=>k).filter(k=>occurrence(k)===0);
  const firstPassDone=()=>firstItems().every(k=>state.answers[k]!==null);
  const laterItems=k=>state.items.map((_,j)=>j).filter(j=>j>k&&state.items[j]===state.items[k]);
  // Option permutation for item k: perm[displayPosition] = original option index. Re-asks get a different order.
  const perm=k=>shuffle([0,1,2,3,4],rng((state.seed^Math.imul(state.items[k]+1,2654435761)^Math.imul(occurrence(k)+1,40503))>>>0));
  const letter=(k,original)=>'ABCDE'[perm(k).indexOf(original)];
  const count=()=>state.answers.filter(a=>a!==null).length;
  const canSkipReasks=()=>count()<total()&&firstPassDone();
  const isCorrect=k=>state.answers[k]===qAt(k).answer;
  // Score, groups, and overview use FIRST attempts only. Re-asks are reported as recovery.
  const score=()=>firstItems().filter(k=>isCorrect(k)).length;
  const correctItems=()=>firstItems().filter(k=>isCorrect(k));
  const missedItems=()=>firstItems().filter(k=>state.answers[k]!==null&&!isCorrect(k));
  const recovered=k=>laterItems(k).some(j=>isCorrect(j));
  const recoveredItems=()=>missedItems().filter(recovered);
  const reasks=()=>total()-firstItems().length;
  function requeue(k){
    if(isCorrect(k)||occurrence(k)+1>=MAX_ASKS)return;
    state.items.push(state.items[k]);
    state.answers.push(null);
  }
  function keepItems(indices){
    state.items=indices.map(k=>state.items[k]);
    state.answers=indices.map(k=>state.answers[k]);
  }
  const canExplain=()=>!standalone&&typeof window.openai?.sendFollowUpMessage==='function'&&!document.documentElement.hasAttribute('data-visualize-standalone');
  function savedState(){
    if(!standalone)return window.openai?.widgetState;
    try{return {privateContent:JSON.parse(window.localStorage.getItem(storageKey))};}catch{return null;}
  }
  function save(){
    if(standalone){
      try{window.localStorage.setItem(storageKey,JSON.stringify(state));}catch{}
      return;
    }
    if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{format:state.format,answered:count(),total:total(),bankSize,correct:score(),firstAttemptQuestions:firstItems().length,reasks:reasks(),recovered:recoveredItems().length,skippedReasks:state.skippedReasks||0,firstChoiceLocked:true,shuffled:true,correctTopics:[...new Set(correctItems().map(k=>qAt(k).correctSkill))],missedTopics:[...new Set(missedItems().map(k=>qAt(k).topic))]},privateContent:state}).catch(()=>{});
  }
  function diagram(d){
    const tables=d.tables.map(table=>`<table class="table table-sm"><caption>${esc(table.label)}</caption><thead><tr>${table.columns.map(column=>`<th scope="col">${esc(column)}</th>`).join('')}</tr></thead><tbody>${table.rows.map(row=>`<tr>${row.map(cell=>`<td class="tabular-nums">${esc(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table>`).join('');
    return `<div class="quiz320-space"><p class="quiz320-status">${esc(d.label)}</p>${d.notes?`<p>${esc(d.notes)}</p>`:''}<div class="quiz320-tables">${tables}</div>${d.source?`<p class="text-small text-muted">${esc(d.source)}</p>`:''}</div>`;
  }
  function feedback(k){
    const q=qAt(k),answer=state.answers[k],index=k;
    const correct=answer===q.answer;
    const again=!correct&&laterItems(k).some(j=>state.answers[j]===null)?' A re-ask is queued for this question.':'';
    const recoveredNote=correct&&occurrence(k)>0?' Recovered on re-ask.':'';
    return `<div class="quiz320-space"><p class="quiz320-status">${correct?'Correct.':'Incorrect.'}${recoveredNote} Correct answer: ${letter(k,q.answer)}. ${esc(q.options[q.answer])}${again}</p><p class="text-small text-muted">Source: ${esc(q.source)}</p><button class="btn" type="button" data-explain="${index}">Explain this answer</button><div class="text-small" data-request-status aria-live="polite"></div></div>`;
  }
  function group(ks){const groups=new Map();for(const k of ks){const q=qAt(k);const topic=q.reviewGroup||q.correctSkill||q.topic;const g=groups.get(topic)||{topic,count:0,k};g.count++;groups.set(topic,g);}return [...groups.values()].sort((a,b)=>b.count-a.count);}
  function overview(){
    const correct=correctItems();
    const missed=missedItems();
    const rightOverview=correct.length?group(correct).slice(0,3).map(g=>g.topic+' ('+g.count+' correct)').join('; ')+'.':'No correct answers in this attempt.';
    const wrongOverview=missed.length?group(missed).slice(0,3).map(g=>g.topic+' ('+g.count+' missed)').join('; ')+'.':'No incorrect answers in this attempt.';
    const improveOverview=missed.length?'Prioritize revisiting: '+group(missed).slice(0,3).map(g=>g.topic).join('; ')+'.':'All questions were correct. Try a harder check of the concepts you answered correctly.';
    const still=missed.filter(k=>!recovered(k));
    const reaskSummary=missed.length?`<p><span class="quiz320-status">Recovered on re-ask:</span> ${missed.length-still.length} of ${missed.length} missed questions.${still.length?' Still to review: '+esc(group(still).map(g=>g.topic).join('; '))+'.':''}</p>`:'';
    const skipped=state.skippedReasks||0;
    return `<div class="quiz320-space"><h3>Quick overview</h3><p><span class="quiz320-status">What was correct:</span> ${esc(rightOverview)}</p><p><span class="quiz320-status">What was wrong:</span> ${esc(wrongOverview)}</p><p><span class="quiz320-status">What to improve:</span> ${esc(improveOverview)}</p>${reaskSummary}${skipped?`<p>Skipped ${skipped} ${skipped===1?'re-ask':'re-asks'}.</p>`:''}<p class="text-small text-muted">Score counts first attempts only. Based on this attempt only.</p></div>`;
  }
  function context(k){
    const q=qAt(k),chosen=state.answers[k],order=perm(k);
    return {questionNumber:k+1,attempt:occurrence(k)+1,id:q.id,topic:q.topic,question:q.q,options:order.map((original,i)=>({label:'ABCDE'[i],text:q.options[original]})),selected:chosen===null?null:{label:letter(k,chosen),text:q.options[chosen]},answerKey:{label:letter(k,q.answer),text:q.options[q.answer]},code:q.code||null,diagram:q.diagram||null,source:q.source};
  }
  async function requestExplanation(button,index){
    if(index!==null&&(!Number.isInteger(index)||index<0||index>=total()||state.answers[index]===null))return;
    const status=index===null?el('explanation-status'):button.parentElement.querySelector('[data-request-status]');
    const correct=correctItems(),missed=missedItems();
    const priorities=group(missed.length?missed:correct).slice(0,3);
    const instruction=index===null?'Explain these CSE 320 quiz results in chat. Report actual strengths and mistakes without inventing private reasoning. Use the supplied priority examples, explain the correct and selected wrong answer where applicable, and give at most three prioritized practice steps. If there were no mistakes, offer a harder check.':'Explain this CSE 320 quiz answer in chat. Explain why the correct answer is correct. If the selected answer is wrong, explain only that selected option’s specific flaw and give one concrete practice step. If it is correct, identify what it gets right and suggest a small next challenge. Do not explain other unselected distractors unless asked.';
    const payload=index===null?{answered:count(),total:total(),correct:score(),correctGroups:group(correct).map(({topic,count})=>({topic,count})),missedGroups:group(missed).map(({topic,count})=>({topic,count})),priorityExamples:priorities.map(g=>context(g.k))}:context(index);
    const prompt=instruction+' Verify the answer calculation and source support before explaining. Report any answer-key error.\n\nQuiz context:\n'+JSON.stringify(payload,null,2);
    await sendFollowUp(button,status,index===null?'Explain my quiz results':'Explain Question '+(index+1),prompt);
  }
  async function sendFollowUp(button,status,title,prompt){
    if(!canExplain()){
      showCopyPrompt(status,prompt);
      return;
    }
    button.disabled=true;
    if(status)status.textContent='Sending to chat…';
    try{
      await window.openai.sendFollowUpMessage({title,prompt});
      if(status)status.textContent='Sent to chat. Continue there.';
    }catch{
      showCopyPrompt(status,prompt);
    }finally{button.disabled=false;}
  }
  // Teach-back: the learner explains the correct answer in their own words, then chat checks it.
  const teachTarget=()=>{const missed=missedItems();const g=group(missed.length?missed:correctItems())[0];return g?g.k:null;};
  function renderTeach(){
    const k=teachTarget();
    if(k===null){el('teach').innerHTML='';return;}
    const q=qAt(k),missed=!isCorrect(k);
    el('teach').innerHTML=`<h3>Teach it back</h3><p>${missed?'You missed':'You got'} Question ${k+1} (${esc(q.topic)}). Without looking at the feedback, explain in one or two sentences why ${letter(k,q.answer)} is correct${missed?' and where your answer went wrong':''}.</p><label class="form-label" for="quiz320-teach-text">Your explanation</label><textarea id="quiz320-teach-text" class="form-control quiz320-teach-field" rows="3" maxlength="${TEACH_MAX}" placeholder="Start with the rule or computation, then the number or value it produces.">${esc(state.teach||'')}</textarea><div class="viz-row"><button id="quiz320-teach-check" class="btn" type="button" ${(state.teach||'').trim()?'':'disabled'}>Check my explanation</button></div><div id="quiz320-teach-status" class="text-small" aria-live="polite"></div>`;
    const field=el('teach-text');
    field.addEventListener('input',()=>{state.teach=field.value.slice(0,TEACH_MAX);el('teach-check').disabled=!state.teach.trim();save();});
    el('teach-check').addEventListener('click',event=>requestTeachCheck(event.currentTarget,k));
  }
  async function requestTeachCheck(button,k){
    const text=(state.teach||'').trim();
    if(!text)return;
    const instruction='Check this CSE 320 learner\'s own explanation of a quiz answer. First verify the answer key. Then say in one line whether the explanation is correct, incomplete, or wrong. If it is incomplete or wrong, name the single missing or mistaken step and ask one question that would lead the learner to it. Do not restate the whole solution and do not explain other options unless asked.';
    const payload={learnerExplanation:text,firstAttemptCorrect:isCorrect(k),question:context(k)};
    await sendFollowUp(button,el('teach-status'),'Check my explanation',instruction+'\n\nQuiz context:\n'+JSON.stringify(payload,null,2));
  }
  // Follow-up quiz request: near-transfer variants of what was missed, weighted toward the missed groups.
  async function requestPractice(button){
    const missed=missedItems();
    if(count()!==total()||!missed.length)return;
    const still=missed.filter(k=>!recovered(k));
    const instruction='Build a follow-up CSE 320 practice quiz with the same skill and template as this one. Weight it toward the missed groups below, prioritizing concepts the learner has yet to recover. For each missed question write one or two near-transfer variants: keep the skill being tested, change the numbers, addresses, code values, or event ordering, and do not reuse the stems or answer texts. Keep five close choices per question, verify every key, and include a few questions from the groups answered correctly so the learner still has to switch between skills. Say which original question each variant practices.';
    const payload={bankSize,correctOnFirstAttempt:score(),missedGroups:group(missed).map(({topic,count})=>({topic,count})),unrecoveredGroups:group(still).map(({topic,count})=>({topic,count})),recoveredOnReask:recoveredItems().length,skippedReasks:state.skippedReasks||0,correctGroups:group(correctItems()).map(({topic,count})=>({topic,count})),missedQuestions:missed.map(k=>context(k))};
    await sendFollowUp(button,el('explanation-status'),'Practice what I missed','Create a practice quiz from these CSE 320 results. '+instruction+'\n\nQuiz context:\n'+JSON.stringify(payload,null,2));
  }
  function showCopyPrompt(status,prompt){
    if(!status)return;
    const label=document.createElement('label');
    label.className='form-label';
    label.textContent='Copy this prompt into your AI chat.';
    const field=document.createElement('textarea');
    field.className='form-control';
    field.rows=4;
    field.readOnly=true;
    field.value=prompt;
    label.append(field);
    status.replaceChildren(label);
    field.focus();
    field.select();
  }
  function renderQuestion(){
    const k=state.index,q=qAt(k),answer=state.answers[k],order=perm(k);
    el('topic').textContent=q.topic;
    const again=occurrence(k)>0?` <span class="viz-badge">Re-ask ${occurrence(k)}</span>`:'';
    el('question').innerHTML=`<h3>Question ${k+1} of ${total()}${again}</h3>${q.diagram?diagram(q.diagram):''}<p>${esc(q.q)}</p>${q.code?`<pre class="quiz320-code"><code>${esc(q.code)}</code></pre>`:''}<fieldset class="quiz320-options"><legend class="sr-only">Select one of five answers</legend>${order.map((original,i)=>`<label class="form-check"><input class="form-check-input" type="radio" name="quiz320-answer" value="${original}" ${original===answer?'checked':''} ${answer!==null?'disabled':''}><span class="form-check-label">${'ABCDE'[i]}. ${esc(q.options[original])}${answer!==null&&original===q.answer?' <span class="quiz320-status">— Correct answer</span>':''}${answer!==null&&original===answer&&answer!==q.answer?' <span class="quiz320-status">— Your answer</span>':''}</span></label>`).join('')}</fieldset>`;
    el('feedback').innerHTML=answer===null?'':feedback(k);
    root.querySelectorAll('input[name="quiz320-answer"]').forEach(input=>input.addEventListener('change',()=>{
      if(state.answers[state.index]!==null)return;
      state.answers[state.index]=Number(input.value);
      requeue(state.index);
      render();save();
    }));
    el('prev').disabled=k===0;
    const last=k===total()-1;
    const beforeReasks=reasks()>0&&k===firstItems().length-1;
    el('next').textContent=last&&count()===total()?'View overview':beforeReasks?'Start re-asks':'Next';
    el('next').disabled=(last&&count()!==total())||(beforeReasks&&!firstPassDone());
    el('skip-reasks').hidden=!canSkipReasks();
  }
  function render(){
    const n=total(),done=count()===n;
    const firsts=firstItems().length;
    el('count').textContent=count()+' / '+n+' answered'+(reasks()?' (incl. '+reasks()+' re-asks)':'')+(done?' · '+score()+' / '+firsts+' correct on first attempt':'');
    el('progress').setAttribute('aria-valuemax',n);
    el('progress').setAttribute('aria-valuenow',count());
    el('progress').firstElementChild.style.width=(count()/n*100)+'%';
    el('results-tab').disabled=!done;
    if(state.tab==='results'&&!done)state.tab='quiz';
    const results=state.tab==='results';
    el('test').hidden=results;el('results').hidden=!results;
    el('test-tab').classList.toggle('active',!results);el('results-tab').classList.toggle('active',results);
    el('test-tab').setAttribute('aria-selected',String(!results));el('results-tab').setAttribute('aria-selected',String(results));
    renderQuestion();
    if(done){
      const missed=missedItems();
      el('score').textContent=score()+' / '+firsts+' correct on first attempt · '+Math.round(score()/firsts*100)+'%'+(firsts<bankSize?' · Retry of '+firsts+' missed questions':'');
      el('overview').innerHTML=overview();
      el('review').innerHTML=firstItems().map(k=>{const q=qAt(k);const later=laterItems(k);const status=isCorrect(k)?'Correct':recovered(k)?'Incorrect · recovered on re-ask':later.length?'Incorrect · missed again on re-ask':'Incorrect';return `<details class="quiz320-review-item"><summary>Question ${k+1} · ${status} · ${esc(q.topic)}</summary>${q.diagram?diagram(q.diagram):''}<p>${esc(q.q)}</p>${q.code?`<pre class="quiz320-code"><code>${esc(q.code)}</code></pre>`:''}<p>Your answer: ${letter(k,state.answers[k])}. ${esc(q.options[state.answers[k]])}</p>${later.map(j=>`<p>Re-ask ${occurrence(j)}: ${letter(j,state.answers[j])}. ${esc(q.options[state.answers[j]])} · ${isCorrect(j)?'Correct':'Incorrect'}</p>`).join('')}${feedback(k)}</details>`;}).join('');
      el('retry-missed').disabled=missed.length===0;
      el('practice-missed').disabled=missed.length===0;
      if(!el('teach-text')||el('teach-text').dataset.k!==String(teachTarget()))renderTeach();
      if(el('teach-text'))el('teach-text').dataset.k=String(teachTarget());
      el('retry-missed').textContent=missed.length?'Retry missed ('+missed.length+')':'Retry missed';
    }
  }
  function restore(snapshot){
    if(valid(snapshot?.privateContent)){
      state=JSON.parse(JSON.stringify(snapshot.privateContent));
      // Older attempts interleaved re-asks with first attempts.
      const firsts=firstItems();
      if(firsts.some((k,i)=>k!==i)){
        const order=firsts.concat(state.items.map((_,k)=>k).filter(k=>!firsts.includes(k)));
        state.index=order.indexOf(state.index);
        keepItems(order);
      }
      if(state.index>=firsts.length&&!firstPassDone())state.index=state.answers.indexOf(null);
    }
    render();
  }
  el('prev').addEventListener('click',()=>{if(state.index>0){state.index--;render();save();}});
  el('next').addEventListener('click',()=>{if(state.index<total()-1)state.index++;else if(count()===total())state.tab='results';render();save();});
  el('skip-reasks').addEventListener('click',()=>{
    if(!canSkipReasks())return;
    state.skippedReasks=total()-count();
    keepItems(state.items.map((_,k)=>k).filter(k=>state.answers[k]!==null));
    state.index=total()-1;
    state.tab='results';
    render();save();
    el('results-tab').focus({preventScroll:true});
  });
  el('test-tab').addEventListener('click',()=>{state.tab='quiz';render();save();});
  el('results-tab').addEventListener('click',()=>{if(count()===total()){state.tab='results';render();save();}});
  el('retry').addEventListener('click',()=>{state=fresh();el('explanation-status').textContent='';el('teach').innerHTML='';render();save();});
  el('retry-missed').addEventListener('click',()=>{const missed=[...new Set(missedItems().map(k=>state.items[k]))];if(!missed.length)return;state=fresh(missed);el('explanation-status').textContent='';el('teach').innerHTML='';render();save();});
  el('explain-results').addEventListener('click',event=>{if(count()===total())requestExplanation(event.currentTarget,null);});
  el('practice-missed').addEventListener('click',event=>requestPractice(event.currentTarget));
  root.addEventListener('click',event=>{const button=event.target.closest('button[data-explain]');if(button&&root.contains(button))requestExplanation(button,Number(button.dataset.explain));});
  if(!standalone)window.addEventListener('openai:set_globals',event=>{const snapshot=event.detail?.globals?.widgetState;if(snapshot&&JSON.stringify(snapshot.privateContent)!==JSON.stringify(state))restore(snapshot);});
  restore(savedState());
})();
</script>
